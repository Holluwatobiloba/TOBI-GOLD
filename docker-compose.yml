version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: tobi_xauusd_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=tobi_xauusd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tobi_xauusd"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tobi_xauusd_api
    restart: unless-stopped
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/tobi_xauusd
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    container_name: tobi_xauusd_bot
    restart: unless-stopped
    command: python telegram-bot/bot.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/tobi_xauusd
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
